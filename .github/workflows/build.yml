name: build

on:
  push:
    branches: [main, codex/windows-0.7.2]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Скачать ядро sing-box
        run: node scripts/fetch-core.mjs

      - name: Проверка генерации конфига ядром
        run: |
          node scripts/check-syntax.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-network.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache/restore@v4
        id: windows-package
        with:
          path: dist
          key: windows-package-${{ hashFiles('src/**', 'build/**', 'package.json', 'package-lock.json', 'electron-builder.yml', 'scripts/check-syntax.mjs') }}

      - name: Пробная сборка (без публикации)
        if: steps.windows-package.outputs.cache-hit != 'true'
        run: npx electron-builder --win --publish never

      - uses: actions/cache/save@v4
        if: steps.windows-package.outputs.cache-hit != 'true'
        with:
          path: dist
          key: ${{ steps.windows-package.outputs.cache-primary-key }}

      - name: Загрузка обновления с GitHub, отмена и проверка SHA-256
        run: node node_modules/electron/cli.js scripts/check-updater.cjs

      - name: Проверка установленного приложения и обновления с 0.3.1
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/check-installed.ps1 -Installer "dist/EVA-VPN-$version-x64.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-acceptance
          path: dist/acceptance
