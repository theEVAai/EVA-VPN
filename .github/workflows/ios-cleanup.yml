name: Remove unintended iOS publication

on:
  push:
    branches: [codex/ios-ipa]
    paths: [.github/workflows/ios-cleanup.yml]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            async function ifPresent(action) {
              try { await action(); } catch (error) { if (error.status !== 404) throw error; }
            }
            await ifPresent(async () => {
              const { data: artifact } = await github.rest.actions.getArtifact({ ...repo, artifact_id: 12098217718 });
              if (artifact.name !== 'EVA-VPN-iOS' || artifact.workflow_run.id !== 39025235054) {
                throw new Error('Unexpected artifact identity; nothing deleted');
              }
              await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
              core.info('Removed iOS IPA Actions artifact');
            });
            await ifPresent(async () => {
              const { data: release } = await github.rest.repos.getRelease({ ...repo, release_id: 415741865 });
              if (release.tag_name !== 'ios-v0.6.0-build.4') {
                throw new Error('Unexpected release identity; nothing deleted');
              }
              await github.rest.repos.deleteRelease({ ...repo, release_id: release.id });
              core.info('Removed iOS release and its assets');
            });
            await ifPresent(async () => {
              const ref = 'tags/ios-v0.6.0-build.4';
              const { data: tag } = await github.rest.git.getRef({ ...repo, ref });
              if (tag.object.sha !== '8216b93447a9a0ee575c22a4e58abb6bfb6b7382') {
                throw new Error('Unexpected iOS tag target; nothing deleted');
              }
              await github.rest.git.deleteRef({ ...repo, ref });
              core.info('Removed iOS-only tag');
            });
