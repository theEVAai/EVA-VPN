name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Скачать ядро sing-box
        run: node scripts/fetch-core.mjs

      - name: Проверки исходников и реального трафика
        run: |
          node scripts/check-syntax.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-elevation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-network.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Загрузка обновления с GitHub, отмена и проверка SHA-256
        run: node node_modules/electron/cli.js scripts/check-updater.cjs

      - name: Сборка и загрузка в черновик
        run: npx electron-builder --win --publish always '-c.publish.releaseType=draft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверка установленного приложения и обновления с 0.3.1
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/check-installed.ps1 -Installer "dist/EVA-VPN-$version-x64.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-acceptance
          path: dist/acceptance

      - uses: actions/upload-artifact@v4
        with:
          name: EVA-VPN-windows
          path: dist/*.exe

      - name: Публикация готового релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = (Get-Content -LiteralPath package.json | ConvertFrom-Json).version
          $releaseNotes = Join-Path docs "RELEASE-$releaseVersion.md"
          if (Test-Path -LiteralPath $releaseNotes) {
            gh release edit "v$releaseVersion" --title "EVA VPN $releaseVersion" --notes-file $releaseNotes --draft=false --latest
          } else {
            gh release edit "v$releaseVersion" --title "EVA VPN $releaseVersion" --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
