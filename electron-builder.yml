appId: com.theeva.vpn
productName: EVA VPN
copyright: theeva.ai
artifactName: EVA-VPN-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - build/icon.png
  - build/tray-on.png
  - build/tray-off.png
  - "!**/*.map"

extraResources:
  - from: core
    to: core
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Туннельный режим создаёт сетевой адаптер — Windows требует прав администратора
  requestedExecutionLevel: requireAdministrator

nsis:
  # карта блоков нужна только electron-updater; своё обновление качает
  # установщик целиком и сверяет sha256 из API GitHub (src/main/updater.js)
  differentialPackage: false
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EVA VPN
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

portable:
  artifactName: EVA-VPN-${version}-portable.exe

publish:
  provider: github
  owner: theEVAai
  repo: EVA-VPN
  releaseType: release
  # в релизе только установщики: latest.yml не нужен — обновление внутри
  # приложения берёт версию и sha256 из API GitHub, а не из манифеста
  publishAutoUpdate: false
